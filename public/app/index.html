<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft Online — free Word alternative in your browser</title>
  <meta name="description" content="Run WordCraft, the free open-source Microsoft Word alternative, directly in your browser. No install, no account.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico">
  <!--
    WordCraft web build (https://github.com/storytold/wordcraft, MIT OR Apache-2.0),
    hosted by wordcraftapp.com. The .wasm ships gzip-compressed
    so it fits static-asset size limits; it is decompressed in the browser below.
    Source, font licenses and local build changes: ./NOTICE.md.
    Rebuild with scripts/update-wordcraft-web.sh.
  -->
  <script type="module" src="./loader.mjs"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center; color: #50575e; font: 14px/1.5 system-ui, sans-serif; background: #f6f7f7; }
    #wordcraft_loading strong { font: 400 28px Georgia, serif; color: #1c2335; letter-spacing: -0.02em; }
    #wordcraft_track { width: min(320px, 80vw); height: 4px; background: #dcdcde; overflow: hidden; }
    #wordcraft_bar { width: 0; height: 100%; background: #d2402f; transition: width .15s; }
    #wordcraft_loading a { color: #d2402f; }
    #wordcraft_loading_content { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 560px; }
    #wordcraft_actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
    #wordcraft_actions[hidden], #wordcraft_track[hidden] { display: none; }
    #wordcraft_retry { border: 0; border-radius: 5px; padding: 9px 16px; background: #d2402f; color: white; font: inherit; cursor: pointer; }
    #wordcraft_actions a, #wordcraft_back { padding: 8px; }
    #wordcraft_status { min-height: 1.5em; }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <noscript>JavaScript is required to run WordCraft. Please enable JavaScript and reload.</noscript>
  <div id="wordcraft_loading" role="status" aria-live="polite">
    <div id="wordcraft_loading_content">
      <strong>WordCraft</strong>
      <div id="wordcraft_track"><div id="wordcraft_bar"></div></div>
      <div id="wordcraft_status">Downloading WordCraft…</div>
      <div id="wordcraft_actions" hidden>
        <button id="wordcraft_retry" type="button">Retry</button>
        <a id="wordcraft_compatibility" href="?webgl">Use compatibility mode</a>
        <a id="wordcraft_download" href="/download" target="_top">Download desktop app</a>
      </div>
      <a id="wordcraft_back" href="/" target="_top">← Back to website</a>
    </div>
  </div>
</body>
</html>
